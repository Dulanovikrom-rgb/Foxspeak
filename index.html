<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="theme-color" content="#1d1230"><title>FoxSpeak</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d1230;--bg2:#2e1a4d;--or:#ff7a29;--mint:#6ef0c2;--tx:#fff4e6;--mut:#b9a8d6;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font:500 16px/1.4 'Plus Jakarta Sans',system-ui,sans-serif;color:var(--tx);background:radial-gradient(120% 70% at 50% -10%,var(--bg2),var(--bg));padding:env(safe-area-inset-top) 0 0;overflow:hidden}
#app{height:100%;overflow-y:auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom))}
.glass{background:rgba(255,255,255,.08);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);border:1px solid rgba(255,255,255,.16);border-radius:24px;box-shadow:0 2px 4px rgba(0,0,0,.2),0 12px 24px rgba(0,0,0,.28),0 30px 60px rgba(0,0,0,.28)}
.btn{font:800 16px 'Plus Jakarta Sans';color:#2a1200;background:linear-gradient(180deg,#ff9a52,var(--or));border:0;border-radius:18px;padding:14px 20px;box-shadow:0 6px 0 #b04a0b,0 12px 24px rgba(255,122,41,.35);transition:transform .12s,box-shadow .12s}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 #b04a0b,0 3px 8px rgba(255,122,41,.3)}
.btn.g{color:var(--tx);background:rgba(255,255,255,.12);box-shadow:0 4px 0 rgba(0,0,0,.35)}
.btn.big{width:100%;font-size:19px;padding:18px}
h1,h2,h3{margin:0}h2{font-size:20px;margin:18px 0 10px}
.row{display:flex;gap:10px;align-items:center}.sp{justify-content:space-between}
.note{font:700 21px Caveat,cursive;color:var(--mint)}
.mut{color:var(--mut);font-size:13px}
nav.glass{position:fixed;left:0;right:0;bottom:0;display:flex;padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:5;border-radius:24px 24px 0 0;border-bottom:0;background:rgba(29,18,48,.94)}
nav button{flex:1;background:0;border:0;color:var(--mut);font:700 12px 'Plus Jakarta Sans';padding:8px;border-radius:18px}
nav button.on{color:#2a1200;background:var(--or)}
.hero{padding:16px;perspective:700px;text-align:center}
.tilt{transition:transform .15s;transform-style:preserve-3d}
.fox{width:120px;animation:br 3.4s ease-in-out infinite}
@keyframes br{50%{transform:scale(1.04)}}
.eye{animation:bl 4s infinite;transform-origin:center;transform-box:fill-box}
@keyframes bl{94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chip{padding:12px;text-align:center;font-weight:700;border-radius:16px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14)}
.pill{padding:12px 16px;border-radius:99px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.1);color:var(--tx);font:700 16px 'Plus Jakarta Sans';box-shadow:0 4px 0 rgba(0,0,0,.35);transition:transform .1s}
.pill:active{transform:translateY(3px);box-shadow:none}
.pill.sel{background:var(--or);color:#2a1200}
.ov{position:fixed;inset:0;background:var(--bg);z-index:10;display:none;flex-direction:column;padding:calc(12px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom))}
.ov.on{display:flex}
.bar{height:8px;background:rgba(255,255,255,.12);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:100%;background:var(--mint);transition:width .1s linear}
.scene{flex:1;perspective:900px;display:flex;align-items:center;margin:14px 0}
.card{position:relative;width:100%;min-height:340px;transform-style:preserve-3d;transition:transform .7s cubic-bezier(.34,1.56,.64,1)}
.card.f{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;padding:20px;display:flex;flex-direction:column;justify-content:center;text-align:center;gap:14px}
.back{transform:rotateY(180deg)}
.pills{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#2a1747;border-radius:28px 28px 0 0;padding:20px 0 calc(20px + env(safe-area-inset-bottom));transform:translateY(110%);transition:transform .4s cubic-bezier(.34,1.3,.64,1);box-shadow:0 -20px 60px rgba(0,0,0,.5)}
.sheet.on{transform:none}
.sl{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}.sl::-webkit-scrollbar{display:none}
.sl>div{flex:0 0 100%;scroll-snap-align:center;padding:4px 24px;text-align:center}
.dots{display:flex;gap:8px;justify-content:center;margin:12px}.dots i{width:9px;height:9px;border-radius:9px;background:#fff4;transition:.2s}.dots i.on{background:var(--or);width:22px}
.drop{position:fixed;left:16px;right:16px;top:0;z-index:30;transform:translateY(-130%);transition:transform .6s cubic-bezier(.34,1.56,.64,1);padding:10px 14px;display:flex;gap:10px;align-items:center;margin-top:env(safe-area-inset-top)}
.drop.on{transform:translateY(8px)}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:#000c;padding:10px 16px;border-radius:99px;z-index:40;font-size:14px}
.cf{position:fixed;top:-20px;z-index:50;font-size:24px;animation:fall 2s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
.tabs{display:flex;gap:8px;margin-bottom:12px;overflow-x:auto}.tabs .pill{white-space:nowrap}
table{width:100%;border-collapse:collapse}td{padding:10px;border-top:1px solid #fff2;width:50%}td:active{background:#ff7a2933}
.kb{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
input[type=range]{width:100%;accent-color:var(--or)}
select{font:700 15px 'Plus Jakarta Sans';padding:10px;border-radius:14px;background:#fff1;color:var(--tx);border:1px solid #fff3}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}.g2 .pill{width:100%;padding:12px 6px}
.mcard{width:100%;padding:18px;color:var(--tx);font:inherit;text-align:center;border-radius:24px}.mc>div{padding:4px 8px!important}
.modal{position:fixed;inset:0;z-index:35;background:#000a;display:none;align-items:center;justify-content:center;padding:20px}.modal.on{display:flex}.mbox{padding:24px;max-width:360px;text-align:center;background:#2a1747;animation:pop .35s cubic-bezier(.34,1.56,.64,1)}@keyframes pop{from{transform:scale(.8);opacity:0}}
details summary{cursor:pointer;list-style:none}details summary::-webkit-details-marker{display:none}details summary::after{content:' ›';color:var(--or)}details[open] summary::after{content:' ⌄'}
#flag{position:fixed;inset:0;z-index:0;pointer-events:none;opacity:0;transition:opacity .45s}#flag:after{content:'';position:absolute;inset:0;background:linear-gradient(180deg,rgba(29,18,48,.2),#1d1230 92%)}#app{position:relative;z-index:1}
.hero-fox{width:100%;max-width:290px;margin:0 auto;position:relative;transition:filter .3s}
.hero-fox img{width:100%;display:block;-webkit-mask-image:radial-gradient(ellipse 64% 68% at 50% 46%,#000 50%,transparent 100%);mask-image:radial-gradient(ellipse 64% 68% at 50% 46%,#000 50%,transparent 100%);animation:float 4.2s ease-in-out infinite;pointer-events:none}
@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg) scale(1)}50%{transform:translateY(-7px) rotate(1deg) scale(1.025)}}
.hero-fox.talk{animation:glow .9s ease-in-out infinite}
@keyframes glow{0%,100%{filter:drop-shadow(0 0 8px #ff7a29aa) drop-shadow(0 0 18px #8a4dff66)}50%{filter:drop-shadow(0 0 22px #ff7a29) drop-shadow(0 0 44px #8a4dffcc)}}
.hero-fox.hop{animation:hop .55s cubic-bezier(.34,1.56,.64,1),glow .9s ease-in-out 2}
@keyframes hop{30%{transform:translateY(-22px) scale(1.04)}60%{transform:translateY(0) scaleY(.97)}}
.av{border-radius:50%;object-fit:cover;object-position:50% 18%;background:#2a1747;flex:none;border:2px solid var(--or)}
.toast{max-width:88vw;text-align:center;border-radius:18px}input[type=text],#vi1,#vi2{font:inherit;padding:10px;border-radius:12px;border:1px solid #fff3;background:#fff1;color:var(--tx);min-width:0;width:100%}.sy{transition:background .1s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.seg{display:flex;gap:8px;justify-content:center;margin-top:8px}.seg .pill{flex:1;max-width:160px;padding:8px 12px;font-size:14px}
.em{font-size:56px;line-height:1.1}.ins{color:var(--tx);font:600 15px 'Plus Jakarta Sans';opacity:.92;line-height:1.35}
.btn.rec{background:linear-gradient(180deg,#ff7b7b,#d94a4a);color:#fff;box-shadow:0 6px 0 #8f2323,0 12px 24px rgba(217,74,74,.4);animation:recp 1s ease-in-out infinite}
@keyframes recp{50%{filter:brightness(1.18)}}
.abtn{min-height:58px}.card.f #fr{pointer-events:none}.card:not(.f) #bk{pointer-events:none}
@media(max-height:640px){#sp.ov{padding-top:calc(8px + env(safe-area-inset-top));padding-bottom:calc(8px + env(safe-area-inset-bottom))}.scene{margin:6px 0}.card{min-height:236px}.face{padding:10px 14px;gap:8px}.em{font-size:38px}#fr h1{font-size:23px!important}.ins{font-size:13px}.abtn{min-height:52px;padding:12px}#sp .btn.g{padding:9px 14px}#sp .pill{padding:9px 14px}.seg{margin-top:4px}}
button:focus-visible,select:focus-visible{outline:3px solid var(--mint);outline-offset:2px}
.flame{position:relative;width:56px;height:70px;margin:2px auto 0}.flame::before{content:'';position:absolute;inset:-8px;border-radius:50%;background:radial-gradient(circle at 50% 72%,rgba(255,122,41,.35),transparent 65%)}.flame svg{position:absolute;left:0;top:0;width:100%;height:100%;transform-origin:50% 100%;transform:scale(var(--fs,.38));animation:flk 1.1s ease-in-out infinite alternate;will-change:transform}.flame .fl-i{animation-duration:.8s;animation-direction:alternate-reverse}@keyframes flk{from{transform:scale(var(--fs,.38)) translateY(0)}to{transform:scale(calc(var(--fs,.38)*1.07)) translateY(-1px)}}@media(prefers-reduced-motion:reduce){.flame svg{animation:none}}
</style></head><body>
<div id="flag" aria-hidden="true"></div>
<div id="app"></div>
<nav class="glass" id="nav"></nav>

<div class="ov" id="sp">
 <div class="row sp"><button class="btn g" id="spx" style="padding:10px 16px">✕</button><div class="mut" id="hud"></div><div class="mut" id="tt"></div></div>
 <div class="bar" style="margin-top:10px"><i id="tb"></i></div>
 <div class="mut" id="cal" style="margin-top:8px;text-align:center"></div>
 <div class="seg" id="am" role="group"><button class="pill sel" id="amw" type="button" aria-pressed="true"></button><button class="pill" id="amm" type="button" aria-pressed="false"></button></div>
 <div class="scene"><div class="card" id="cd">
  <div class="face glass" id="fr"></div><div class="face glass back" id="bk"></div></div></div>
 <div class="row" style="gap:10px"><button class="btn g" style="flex:1" id="hb"></button><button class="btn g" id="vb">🗣️</button></div>
</div>

<div class="sheet" id="sh"><div class="sl" id="sl"></div><div class="dots" id="dt"></div><div style="padding:0 24px"><button class="btn big" id="shx"></button></div></div>
<div class="ov" id="tour" style="background:#000d;justify-content:center;align-items:center;z-index:25"><div class="glass" style="padding:24px;max-width:340px;text-align:center"><div class="note" id="tn"></div><p id="tp"></p><button class="btn" id="tb2"></button></div></div>
<div class="modal" id="md"><div class="glass mbox" id="mb"></div></div>
<div class="modal" id="vm" style="align-items:flex-end;padding:0"><div class="glass mbox" id="vsh" style="max-width:none;width:100%;border-radius:28px 28px 0 0;padding-bottom:calc(20px + env(safe-area-inset-bottom))"></div></div>
<div class="ov" id="tr"><div class="row sp"><button class="btn g" id="trx" style="padding:10px 16px">✕</button><b id="trt"></b><span id="trs" class="mut"></span></div><div id="trb" style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;text-align:center"></div></div>
<div class="drop glass" id="dr"></div>

<script src="data.js"></script>
<script src="games.js"></script>
<script src="app.js"></script>
</body></html>
