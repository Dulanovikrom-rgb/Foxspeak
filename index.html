<style>

table{width:100%;border-collapse:collapse}td{padding:10px;border-top:1px solid #fff2;width:50%}td:active{background:#ff7a2933}

@keyframes float{0%,100%{transform:translateY(0) rotate(-1deg) scale(1)}50%{transform:translateY(-7px) rotate(1deg) scale(1.025)}}

.hero-fox.hop{animation:hop .55s cubic-bezier(.34,1.56,.64,1),glow .9s ease-in-out 2}

.av{border-radius:50%;object-fit:cover;object-position:50% 18%;background:#2a1747;flex:none;border:2px solid var(--or)}
.toast{max-width:88vw;text-align:center;border-radius:18px}input[type=text],#vi1,#vi2{font:inherit;padding:10px;border-radius:12px;border:1px solid #fff3;background:#fff1;color:var(--tx);min-width:0;width:100%}.sy{transition:background .1s}

лады.|Түлкү үндөштүктү таап, көрүнүш тартат — күлкүлүү сүрөт бир жолуда эсте калат.|Tilki benzer sesi bulur ve sahne çizer: komik resim ilk seferde akılda kalır.|Tilki sesdeşligi tapýar we sahna çekýär — gülkünç surat ilkinji gezekde ýadda galýar.','Ошибся или взял подсказку — фраза вернётся; пока не ответишь 4 раза подряд, новых не будет.|Хата ясадың яки ярдәм алдың — фраза кире кайта; рәттән 4 дөрес җавапка кадәр яңасы булмый.|Xato qilsang yoki maslahat olsang — ibora qaytadi; ketma-ket 4 marta to‘g‘ri javobgacha yangisi bo‘lmaydi.|Хато кунӣ ё маслиҳат гирӣ — ибора бармегардад; то 4 ҷавоби дуруст пай дар пай нав намешавад.|Қателессең немесе кеңес алсаң — фраза қайтады; қатарынан 4 дұрыс жауапқа дейін жаңасы болмайды.|Ката кетирсең же кеңеш алсаң — фраза кайтат; удаа 4 туура жоопко чейин жаңысы болбойт.|Hata yaparsan ya da ipucu alırsan cümle geri gelir; art arda 4 doğruya kadar yenisi gelmez.|Ýalňyşsaň ýa-da maslahat alsaň — sözlem gaýdyp gelýär; yzly-yzyna 4 dogry jogaba çenli täzesi bolmaýar.','Собери фразу по словам, услышь голос диктора и повтори вслух: глаз, ухо и рот работают вместе.|Фразаны сүзләрдән җый, диктор тавышын ишет һәм кычкырып кабатла: күз, колак, авыз бергә эшли.|Iborani so‘zlardan yig‘, diktor ovozini eshit va baland takrorla: ko‘z, quloq va og‘iz birga ishlaydi.|Иборарро аз калимаҳо ҷамъ кун, овози гӯяндаро шунав ва баланд такрор кун: чашм, гӯш ва даҳон якҷоя кор мекунанд.|Фразаны сөздерден құра, диктор дауысын тыңда да, дауыстап қайтала: көз, құлақ, ауыз бірге жұмыс істейді.|Фразаны сөздөрдөн түз, диктордун үнүн уккула да, катуу кайтала: көз, кулак, оозу бирге иштейт.|Cümleyi kelimelerden kur, spikerin sesini dinle ve yüksek sesle tekrarla: göz, kulak ve ağız birlikte çalışır.|Sözlemi sözlerden düz, diktoryň sesini diňle we ýokary ses bilen gaýtala: göz, gulak we agyz bilelikde işleýär.'];
const mth=(i,k)=>{const v=(k?ME[i]:MT[i]).split('|');return v[LK.indexOf(S.lang)]||v[0]};
/* словарь */
const SEED=['fox|лис|төлке|tulki|рӯбоҳ|түлкі|түлкү|tilki|tilki','smile|улыбка|елмаю|tabassum|табассум|күлкі|жылмаюу|gülümseme|ýylgyryş','water|вода|су|suv|об|су|суу|su|suw','road|дорога|юл|yo‘l|роҳ|жол|жол|yol|ýol','friend|друг|дус|do‘st|дӯст|дос|дос|arkadaş|dost','sleep|сон|йокы|uyqu|хоб|ұйқы|уйку|uyku|uky'];
function vinit(){if(!S.vocab){S.vocab=SEED.map(x=>{const p=x.split('|');return{en:p[0],tr:p.slice(1).join('|'),st:'learn',b:0}});save()}}
const nat=e=>e.tr?(e.tr.split('|')[LK.indexOf(S.lang)]||e.tr.split('|')[0]):e.n;
let vt='learn',vdir=0;
function voc(){const l=S.vocab.filter(e=>e.st===vt).sort((a,b)=>(b.b||0)-(a.b||0)),U=S.lang.toUpperCase();
 $('#app').innerHTML=`<h2 style="margin-top:4px">📖 ${t('vk')}</h2><div class="tabs">${[['learn','v1'],['done','v2'],['base','v3']].map(x=>`<button class="pill vt ${x[0]===vt?'sel':''}" data-s="${x[0]}">${t(x[1])} · ${S.vocab.filter(e=>e.st===x[0]).length}</button>`).join('')}</div>
 <button class="btn g" id="vad" style="width:100%;margin-bottom:10px">${t('va')}</button>
 <div id="vf" class="row" style="display:none;margin-bottom:10px"><input id="vi1" placeholder="EN" autocapitalize="none"><input id="vi2" placeholder="${U}"><button class="btn" id="vok" style="padding:12px 16px">✔</button></div>
 ${l.map(e=>{const n=nat(e);return`<div class="glass row sp" style="padding:12px 14px;margin-bottom:8px"><div class="vw" data-w="${e.en}" style="flex:1;min-width:0"><b style="font-size:19px">${vdir?n:e.en}</b>${e.b?' ⚡'+e.b:''}<div class="mut">${vdir?e.en:n}</div></div><button class="btn g vm" data-w="${e.en}" aria-label="menu" style="padding:8px 16px;font-size:20px">⋮</button></div>`}).join('')}
 <div style="height:76px"></div><button class="btn g" id="vdir" style="position:fixed;left:0;right:0;margin:0 auto;width:max-content;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;background:#3a2260">${vdir?U+' → EN':'EN → '+U} ⇄</button>`;
 $$('.vt').forEach(b=>b.onclick=()=>{vt=b.dataset.s;voc()});$('#vad').onclick=()=>{const f=$('#vf');f.style.display=f.style.display==='none'?'flex':'none'};
 $('#vok').onclick=()=>{const en=$('#vi1').value.trim(),n=$('#vi2').value.trim();if(en&&n){S.vocab.push({en,n,st:'learn',b:0});save();voc()}};
 $('#vdir').onclick=()=>{vdir^=1;voc()};$$('.vw').forEach(b=>b.onclick=()=>say(b.dataset.w));$$('.vm').forEach(b=>b.onclick=()=>vsheet(b.dataset.w))}
function vsheet(w){const e=S.vocab.find(x=>x.en===w);if(!e)return;
 $('#vsh').innerHTML=`<div style="padding:6px 0 18px"><div style="font-size:42px;font-weight:800;color:var(--or);text-shadow:0 0 26px #ff7a29">${e.en}</div><div class="note" style="font-size:28px">${nat(e)}</div></div>${['a1','a2','a3','a4'].map(k=>`<button class="btn g va" data-k="${k}" style="width:100%;margin-bottom:10px;text-align:left">${t(k)}</button>`).join('')}`;
 $('#vm').classList.add('on');$$('.va').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(k==='a1'){e.b=(e.b||0)+1;e.st='learn'}if(k==='a2')e.st='done';if(k==='a3')e.st='base';if(k==='a4')S.vocab=S.vocab.filter(x=>x!==e);save();$('#vm').classList.remove('on');voc()})}
$('#vm').onclick=e=>{if(e.target.id==='vm')$('#vm').classList.remove('on')};
/* тренажёры */
let trk,ti=0,tsc=0,tm_,trTok=0,rec;
function trOpen(k){trk=k;ti=0;tsc=0;$('#tr').classList.add('on');$('#trt').textContent=['🎬 ','🎵 ','🗣️ ','🐾 '][k]+t('n'+(k+1));trStep()}
function trClose(){trTok++;clearInterval(tm_);try{speechSynthesis.cancel();rec&&rec.stop()}catch(e){}$('#tr').classList.remove('on');render()}
$('#trx').onclick=trClose;
function trStep(){trTok++;clearInterval(tm_);$('#trs').textContent='⭐ '+tsc;[dub,rhy,sha,trl][trk]()}
function tick(a){AC();ac.resume&&ac.resume();const T=ac.currentTime,o=ac.createOscillator(),g=ac.createGain();o.frequency.value=a?1200:800;g.gain.setValueAtTime(.2*S.vol,T);g.gain.exponentialRampToValueAtTime(.001,T+.06);o.connect(g);g.connect(ac.destination);o.start(T);o.stop(T+.07)}
function dub(){const D2=[[3,1],[5,4],[9,7],[6,2]],p=D2[ti%4];
 $('#trb').innerHTML=`<div class="glass" style="padding:16px"><div class="mut">🎬 A</div><h2 style="margin:6px 0">${P[p[0]][0]}</h2><div class="mut">${tr(p[0])}</div><button class="btn g" id="d1" style="margin-top:8px">▶</button></div><div class="glass" style="padding:16px"><div class="mut">🎭 B — 🎤</div><h2 style="margin:6px 0">${P[p[1]][0]}</h2><div class="mut">${tr(p[1])}</div><button class="btn g" id="d2" style="margin-top:8px">🔊</button></div><button class="btn big" id="dn">✔</button>`;
 $('#d1').onclick=()=>say(P[p[0]][0],'en-GB');$('#d2').onclick=()=>say(P[p[1]][0],'en-US');$('#dn').onclick=()=>{tsc++;ti++;trStep()};setTimeout(()=>say(P[p[0]][0],'en-GB'),300)}
const syl=w=>w.match(/[^aeiouy]*[aeiouy]+(?:[^aeiouy]+$)?|[^aeiouy]+$/gi)||[w];
function rhy(){const i=ti%P.length,sy=P[i][0].split(' ').flatMap(w=>syl(w.replace(/[^\w']/g,''))),tok=trTok;let j=0,fin=0;
 $('#trb').innerHTML=`<div class="mut">${tr(i)}</div><div style="font-size:30px;font-weight:800;line-height:1.7">${sy.map((x,k)=>`<span class="sy" id="sy${k}" style="padding:2px 6px;border-radius:10px">${x}</span>`).join('·')}</div><label class="mut">🥁 <input type="range" id="bp" min="60" max="120" value="${S.bpm||80}"></label>`;
 const go=()=>{$$('.sy').forEach(e=>e.style.background='');if(j<sy.length){$('#sy'+j).style.background='var(--or)';tick(j%4===0);j++}else{fin=1;clearInterval(tm_);say(P[i][0]);tsc++;$('#trs').textContent='⭐ '+tsc;setTimeout(()=>{if(tok===trTok){ti++;trStep()}},2400)}};
 const run=()=>{clearInterval(tm_);tm_=setInterval(go,60000/(S.bpm||80))};$('#bp').oninput=e=>{S.bpm=+e.target.value;save();if(!fin)run()};run()}
function sha(){const i=ti%P.length,en=P[i][0],tok=trTok,SR=window.SpeechRecognition||window.webkitSpeechRecognition;let got=0;
 $('#trb').innerHTML=`<div class="mut">${tr(i)}</div><h1>${en}</h1><div id="sr" style="font-size:44px">🔊</div><button class="btn g" id="sn">▶▶</button>`;
 const next=()=>{if(tok===trTok){ti++;trStep()}};$('#sn').onclick=()=>{try{rec&&rec.stop()}catch(e){}speechSynthesis.cancel();next()};
 const u=new SpeechSynthesisUtterance(en);u.lang=S.acc;u.rate=S.rate;u.pitch=S.pitch;u.volume=S.vol;
 u.onend=()=>{if(tok!==trTok)return;$('#sr').textContent='🎤';if(!SR){setTimeout(next,Math.max(1500,en.length*110));return}
  try{rec=new SR();rec.lang='en-US';rec.onresult=e=>{got=1;const h=e.results[0][0].transcript.toLowerCase().replace(/[^a-z' ]/g,'').split(' '),w=en.toLowerCase().replace(/[^a-z' ]/g,'').split(' '),q=Math.round(w.filter(x=>h.includes(x)).length/w.length*100);if(q>=70)tsc++;$('#sr').textContent=(q>=70?'✅ ':'🔁 ')+q+'%';$('#trs').textContent='⭐ '+tsc;setTimeout(next,1500)};rec.onerror=()=>setTimeout(next,800);rec.onend=()=>{if(!got)setTimeout(next,600)};rec.start()}catch(e){setTimeout(next,2000)}};
 speechSynthesis.cancel();speechSynthesis.speak(u)}
function trl(){if(ti>=5){$('#trb').innerHTML=`<div style="font-size:64px">🏁</div><h1>${tsc} / 5</h1><button class="btn big" id="ra">🔁</button>`;$('#ra').onclick=()=>{ti=0;tsc=0;trStep()};return}
 const i=(ti*3+1)%P.length,ws=P[i][0].split(' '),sh=ws.map((w,k)=>w).sort(()=>Math.random()-.5),tok=trTok;let pos=0,tl=20;
 $('#trb').innerHTML=`<div class="bar"><i id="tlb"></i></div><div class="mut">${tr(i)} · ${ti+1}/5</div><h2 id="bt" style="min-height:40px">…</h2><div class="pills">${sh.map(x=>`<button class="pill tw">${x}</button>`).join('')}</div>`;
 const fin=ok=>{clearInterval(tm_);if(ok){tsc++;say(P[i][0])}else $('#bt').textContent=P[i][0];ti++;$('#trs').textContent='⭐ '+tsc;setTimeout(()=>{if(tok===trTok)trl()},ok?900:1500)};
 $$('.tw').forEach(b=>b.onclick=()=>{if(b.disabled)return;if(b.textContent===ws[pos]){b.disabled=true;b.style.opacity=.3;pos++;$('#bt').textContent=ws.slice(0,pos).join(' ');if(pos===ws.length)fin(true)}else{b.style.background='#d94a4a';tl-=3}});
 tm_=setInterval(()=>{tl-=.1;$('#tlb').style.width=Math.max(0,tl/20*100)+'%';if(tl<=0)fin(false)},100)}
/* ---------- старт ---------- */
(async()=>{await DB.open();const s=await DB.get('S');if(s)Object.assign(S,s);else{const n=(navigator.language||'ru').slice(0,2);S.lang=LN[n]?n:'ru'}
 vinit();if(S.day!==today()){S.day=today();S.today=0}
 if(S.deadline&&S.deadline<Date.now()){S.learned={};S.cyc={};S.deadline=0}
 save();render();
 if(navigator.userAgent&&typeof DeviceOrientationEvent!=='undefined'&&DeviceOrientationEvent.requestPermission)document.body.addEventListener('click',function f(){DeviceOrientationEvent.requestPermission().catch(()=>{});document.body.removeEventListener('click',f)});
 if(S.lofi)document.body.addEventListener('click',function f(){lofi(true);document.body.removeEventListener('click',f)});
 setTimeout(()=>{const g={ru:'Привет! Я Лис. Давай учить английский!',tr:'Merhaba! Ben Tilki.',uz:'Salom! Men Tulkiman.'}[S.lang]||'Привет!';drop(g)},600)})();
</script></body></html>
